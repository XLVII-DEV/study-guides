      <text class="sans" x="32" y="156" font-size="11.5" fill="#aba392">03 · 3-Level Quiz</text>
      <text class="sans" x="32" y="180" font-size="11.5" fill="#aba392">04 · A4 Cheat-Sheet</text>
      <text class="sans" x="24" y="296" font-size="10.5" fill="#aba392">100% Offline · 0 CDNs</text>

      <!-- Topbar Dark -->
      <text class="sans" x="220" y="27" font-size="11.5" font-weight="600" fill="#aba392">study-guides · 6-Slot Compiler</text>
      <rect x="752" y="10" width="106" height="24" rx="6" fill="#2e2414" stroke="#e5a94c" stroke-width="1"/>
      <circle cx="767" cy="22" r="2.6" fill="none" stroke="#ede8dc" stroke-width="1.4"/>
      <path d="M767 16.5v1.3M767 26.2v1.3M761.5 22h1.3M771.2 22h1.3M763.1 18.1l.9.9M770 25l.9.9M763.1 25.9l.9-.9M770 19l.9-.9" fill="none" stroke="#ede8dc" stroke-width="1.3" stroke-linecap="round"/>
      <text class="sans" x="778" y="26" font-size="11" font-weight="600" fill="#ede8dc">Light mode</text>

      <!-- Hero Card Dark -->
      <rect x="220" y="54" width="638" height="104" rx="8" fill="#1d1b17" stroke="#3a342a" stroke-width="1"/>
      <text class="sans" x="240" y="76" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#e5a94c">BLOCK 1 · MASTER PROFESSOR</text>
      <text class="serif" x="240" y="101" font-size="22" font-weight="700" fill="#ede8dc">Transactions &amp; ACID Guarantees</text>
      <text class="sans" x="240" y="121" font-size="12" fill="#aba392">Intuition first · Step-trace mechanism · Worked example · Common mistake vs Right way</text>
      <rect x="240" y="130" width="146" height="19" rx="4" fill="#2e2414" stroke="#e5a94c" stroke-width="1"/>
      <text class="sans" x="313" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#e5a94c">-80% LLM Output Tokens</text>
      <rect x="396" y="130" width="146" height="19" rx="4" fill="#132c1f" stroke="#4ade80" stroke-width="1"/>
      <text class="sans" x="469" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#4ade80">Anti-Bias Quiz: PASS</text>

      <!-- Bottom Left Card Dark (Block 2 & 3) -->
      <rect x="220" y="172" width="310" height="128" rx="8" fill="#1d1b17" stroke="#3a342a" stroke-width="1"/>
      <text class="sans" x="240" y="196" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#e5a94c">BLOCK 2 &amp; 3 · ACTIVE RECALL</text>
      <text class="serif" x="240" y="219" font-size="17" font-weight="700" fill="#ede8dc">Timed Exam + Anki (.tsv)</text>
      <text class="sans" x="240" y="241" font-size="11.5" fill="#aba392">• Drag-and-drop &amp; typed drills</text>
      <text class="sans" x="240" y="260" font-size="11.5" fill="#aba392">• 1 min/question exam countdown</text>
      <text class="sans" x="240" y="279" font-size="11.5" fill="#aba392">• 1-click UTF-8 Anki deck export</text>

      <!-- Bottom Right Card Dark (Block 4) -->
      <rect x="548" y="172" width="310" height="128" rx="8" fill="#1d1b17" stroke="#3a342a" stroke-width="1"/>
      <text class="sans" x="568" y="196" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#e5a94c">BLOCK 4 · PRINT &amp; PRESETS</text>
      <text class="serif" x="568" y="219" font-size="17" font-weight="700" fill="#ede8dc">3 Themes + A4 Summary</text>
      <text class="sans" x="568" y="241" font-size="11.5" fill="#aba392">• warm-serif / ink-editorial / slate-tech</text>
      <text class="sans" x="568" y="260" font-size="11.5" fill="#aba392">• 7 built-in UI languages</text>
      <text class="sans" x="568" y="279" font-size="11.5" fill="#aba392">• Cmd/Ctrl + P prints crisp A4</text>
