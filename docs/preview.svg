<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" role="img" aria-label="Study Guides interactive HTML preview: Light and Dark mode, 4-block pedagogy, Timed Exam and Anki export">
  <defs>
    <clipPath id="winClip">
      <rect x="2" y="2" width="876" height="316" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .serif { font-family: "Times New Roman", Georgia, serif; }
    .scene-dark { opacity: 0; animation: crossfadeDark 8s ease-in-out infinite; }
    @keyframes crossfadeDark {
      0%, 40%, 100% { opacity: 0; }
      50%, 90% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene-dark { animation: none; opacity: 0; }
    }
  </style>

  <!-- Layer 1: Static Light Mode (Warm Academic Serif) -->
  <g class="scene-light" clip-path="url(#winClip)">
    <rect x="2" y="2" width="876" height="316" fill="#fbf7ec"/>
    <rect x="2" y="2" width="196" height="316" fill="#f4eedb"/>
    <line x1="198" y1="2" x2="198" y2="318" stroke="#dfd6bc" stroke-width="1"/>
    <line x1="198" y1="42" x2="878" y2="42" stroke="#dfd6bc" stroke-width="1"/>

    <!-- Sidebar -->
    <text class="serif" x="24" y="32" font-size="15" font-weight="700" fill="#1f2421">Contents</text>
    <rect x="20" y="48" width="160" height="26" rx="5" fill="#fffdf7" stroke="#8a7e63" stroke-width="1"/>
    <text class="sans" x="30" y="65" font-size="11" fill="#5a5549">Filter sections (/)...</text>
    <rect x="20" y="88" width="160" height="26" rx="6" fill="#fffdf7" stroke="#dfd6bc" stroke-width="1"/>
    <rect x="20" y="88" width="3" height="26" rx="1.5" fill="#8c5214"/>
    <text class="sans" x="32" y="105" font-size="11.5" font-weight="700" fill="#1f2421">01 · Teacher's Guide</text>
    <text class="sans" x="32" y="132" font-size="11.5" fill="#5a5549">02 · Fill-in Practice</text>
    <text class="sans" x="32" y="156" font-size="11.5" fill="#5a5549">03 · 3-Level Quiz</text>
    <text class="sans" x="32" y="180" font-size="11.5" fill="#5a5549">04 · A4 Cheat-Sheet</text>
    <text class="sans" x="24" y="296" font-size="10.5" fill="#5a5549">100% Offline · 0 CDNs</text>

    <!-- Topbar -->
    <text class="sans" x="220" y="27" font-size="11.5" font-weight="600" fill="#5a5549">study-guides · 6-Slot Compiler</text>
    <rect x="752" y="10" width="106" height="24" rx="6" fill="#fffdf7" stroke="#8a7e63" stroke-width="1"/>
    <path d="M771 24.8a4.5 4.5 0 1 1-4.9-4.9 3.5 3.5 0 0 0 4.9 4.9z" fill="none" stroke="#1f2421" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sans" x="779" y="26" font-size="11" font-weight="600" fill="#1f2421">Dark mode</text>

    <!-- Hero Card -->
    <rect x="220" y="54" width="638" height="104" rx="8" fill="#fffdf7" stroke="#dfd6bc" stroke-width="1"/>
    <text class="sans" x="240" y="76" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#8c5214">BLOCK 1 · MASTER PROFESSOR</text>
    <text class="serif" x="240" y="101" font-size="22" font-weight="700" fill="#1f2421">Transactions &amp; ACID Guarantees</text>
    <text class="sans" x="240" y="121" font-size="12" fill="#5a5549">Intuition first · Step-trace mechanism · Worked example · Common mistake vs Right way</text>
    <rect x="240" y="130" width="146" height="19" rx="4" fill="#f3e6cf" stroke="#8c5214" stroke-width="1"/>
    <text class="sans" x="313" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#8c5214">-80% LLM Output Tokens</text>
    <rect x="396" y="130" width="146" height="19" rx="4" fill="#dcf3ea" stroke="#146c53" stroke-width="1"/>
    <text class="sans" x="469" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#146c53">Anti-Bias Quiz: PASS</text>

    <!-- Bottom Left Card (Block 2 & 3) -->
    <rect x="220" y="172" width="310" height="128" rx="8" fill="#fffdf7" stroke="#dfd6bc" stroke-width="1"/>
    <text class="sans" x="240" y="196" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#8c5214">BLOCK 2 &amp; 3 · ACTIVE RECALL</text>
    <text class="serif" x="240" y="219" font-size="17" font-weight="700" fill="#1f2421">Timed Exam + Anki (.tsv)</text>
    <text class="sans" x="240" y="241" font-size="11.5" fill="#5a5549">• Drag-and-drop &amp; typed drills</text>
    <text class="sans" x="240" y="260" font-size="11.5" fill="#5a5549">• 1 min/question exam countdown</text>
    <text class="sans" x="240" y="279" font-size="11.5" fill="#5a5549">• 1-click UTF-8 Anki deck export</text>

    <!-- Bottom Right Card (Block 4) -->
    <rect x="548" y="172" width="310" height="128" rx="8" fill="#fffdf7" stroke="#dfd6bc" stroke-width="1"/>
    <text class="sans" x="568" y="196" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#8c5214">BLOCK 4 · PRINT &amp; PRESETS</text>
    <text class="serif" x="568" y="219" font-size="17" font-weight="700" fill="#1f2421">3 Themes + A4 Summary</text>
    <text class="sans" x="568" y="241" font-size="11.5" fill="#5a5549">• warm-serif / ink-editorial / slate-tech</text>
    <text class="sans" x="568" y="260" font-size="11.5" fill="#5a5549">• 7 built-in UI languages</text>
    <text class="sans" x="568" y="279" font-size="11.5" fill="#5a5549">• Cmd/Ctrl + P prints crisp A4</text>
  </g>
  <rect x="2" y="2" width="876" height="316" rx="12" fill="none" stroke="#dfd6bc" stroke-width="1.5"/>

  <!-- Layer 2: Static Dark Mode (Single group opacity crossfade — zero per-element desync) -->
  <g class="scene-dark">
    <g clip-path="url(#winClip)">
      <rect x="2" y="2" width="876" height="316" fill="#141310"/>
      <rect x="2" y="2" width="196" height="316" fill="#26231d"/>
      <line x1="198" y1="2" x2="198" y2="318" stroke="#3a342a" stroke-width="1"/>
      <line x1="198" y1="42" x2="878" y2="42" stroke="#3a342a" stroke-width="1"/>

